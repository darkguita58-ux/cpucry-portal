<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal</title>
<style>
  [hidden] { display: none !important; }
  :root {
    --bg: #0b1220;
    --surface: #111a2e;
    --surface-2: rgba(148, 163, 184, 0.08);
    --border: rgba(148, 163, 184, 0.22);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --primary: #f43f5e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: "Source Sans Pro", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  /* Login gate */
  .login-shell {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .di-login-card {
    width: 100%; max-width: 420px; padding: 28px 24px 22px;
    border-radius: 14px; border: 1px solid var(--border);
    background: var(--surface); box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    text-align: center;
  }
  .di-login-card h2 { margin: 0 0 16px 0; font-size: 1.35rem; font-weight: 600; color: #f8fafc; }
  .di-login-form { display: flex; flex-direction: column; gap: 12px; }
  .di-input {
    width: 100%; padding: 11px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: #090f1c; color: #f8fafc;
    font-size: 15px; outline: none;
  }
  .di-input:focus { border-color: var(--accent); }
  .di-btn {
    padding: 11px 16px; border-radius: 8px; border: none; cursor: pointer;
    background: #2563eb; color: #ffffff; font-size: 15px; font-weight: 600;
    transition: background 0.15s ease;
  }
  .di-btn:hover { background: #1d4ed8; }
  .di-btn:disabled { opacity: 0.65; cursor: wait; }
  .di-login-err {
    margin-top: 10px; padding: 9px 12px; border-radius: 8px;
    background: rgba(244, 63, 94, 0.16); border: 1px solid rgba(244, 63, 94, 0.4);
    color: #fecdd3; font-size: 13.5px; display: none;
  }
  /* Live full-screen container */
  #live-shell {
    position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 5000; background: var(--bg);
  }
  #live-frame {
    width: 100%; height: 100%; border: 0; display: block; background: var(--bg);
  }
  /* Floating corner switcher dock */
  #mode-dock {
    position: fixed; right: 14px; bottom: 14px; z-index: 6000;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 7px 11px; border-radius: 999px;
    background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(148, 163, 184, 0.35);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); backdrop-filter: blur(8px);
    font-size: 12.5px;
  }
  .dock-badge-live { color: #6ee7b7; font-weight: 600; }
  .dock-badge-off { color: #cbd5e1; font-weight: 500; }
  .dock-btn {
    padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
    background: rgba(148, 163, 184, 0.14); color: #f8fafc; cursor: pointer;
    font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
  }
  .dock-btn:hover { background: rgba(148, 163, 184, 0.28); text-decoration: none; }
  /* Offline container */
  .portal-wrap { max-width: 1400px; margin: 0 auto; padding: 14px 18px 70px; }
  .portal-bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px; padding: 10px 14px; margin-bottom: 12px;
    border-radius: 12px; border: 1px solid var(--border); background: var(--surface);
    font-size: 13.5px;
  }
  .snap-caption { font-size: 12.5px; color: var(--muted); margin: 4px 0 10px; }
  .snap-subhead { margin: 14px 0 8px; font-size: 1.05rem; color: #f8fafc; }
  .snap-p { margin: 3px 0; }
  .snap-quote {
    margin: 8px 0 12px; padding: 8px 14px; border-left: 3px solid var(--accent);
    background: rgba(56, 189, 248, 0.06); border-radius: 0 8px 8px 0; color: #cbd5e1;
  }
  .snap-alert {
    padding: 10px 14px; border-radius: 8px; margin: 8px 0; font-size: 14px;
    border: 1px solid var(--border); background: var(--surface-2);
  }
  .snap-alert-info { border-color: rgba(56, 189, 248, 0.35); background: rgba(56, 189, 248, 0.1); }
  .snap-alert-success { border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.1); color: #a7f3d0; }
  .snap-alert-warning { border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.1); color: #fde68a; }
  .snap-alert-error { border-color: rgba(244, 63, 94, 0.45); background: rgba(244, 63, 94, 0.12); color: #fecdd3; }
  .snap-cols { display: grid; gap: 14px; margin: 6px 0; align-items: start; }
  .snap-col { min-width: 0; }
  .st-card {
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    margin: 8px 0 12px; background: rgba(17, 26, 46, 0.55);
  }
  .st-metric { padding: 4px 0; }
  .st-m-l { font-size: 12.5px; color: var(--muted); }
  .st-m-v { font-size: 26px; font-weight: 600; color: #f8fafc; line-height: 1.25; }
  .st-prog { width: 100%; height: 8px; border-radius: 999px; background: rgba(148, 163, 184, 0.18); overflow: hidden; margin: 6px 0 10px; }
  .st-prog-fill { height: 100%; background: linear-gradient(90deg, #2563eb, #10b981); }
  /* Streamlit-like interactive controls */
  .st-w { margin: 4px 0 10px; }
  .st-lbl { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .st-select, .st-input, .st-textarea {
    width: 100%; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: #0f172a; color: #f8fafc;
    font-size: 13.5px; font-family: inherit;
  }
  .st-multi {
    display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; border-radius: 8px;
    border: 1px solid var(--border); background: #0f172a; min-height: 36px;
  }
  .st-chip {
    background: var(--primary); color: #fff; font-size: 12px; padding: 2px 7px; border-radius: 5px;
  }
  .st-chip-muted { background: rgba(148, 163, 184, 0.22); color: #cbd5e1; }
  .st-radio-row { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
  .st-radio-h { flex-direction: row; flex-wrap: wrap; gap: 12px; }
  .st-radio-opt, .st-toggle-row { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; cursor: pointer; }
  .st-range { width: 100%; accent-color: var(--primary); }
  .st-btn {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: #1e293b; color: #f8fafc; cursor: pointer; font-size: 13.5px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin: 4px 0;
  }
  .st-btn:hover:not(:disabled) { border-color: var(--primary); color: #fff; }
  .st-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .st-btn-block { width: 100%; }
  .st-uploader {
    padding: 12px; border-radius: 8px; border: 1px dashed var(--border);
    background: rgba(148, 163, 184, 0.05); color: var(--muted); font-size: 13px; text-align: center;
  }
  .snap-exp {
    margin: 8px 0 12px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: rgba(148, 163, 184, 0.04);
  }
  .snap-exp > summary { cursor: pointer; font-weight: 500; font-size: 13.5px; color: #e2e8f0; }
  .snap-exp-body { margin-top: 10px; }
  .snap-tabs-block { margin-top: 8px; }
  .snap-tab-bar {
    display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border);
    padding-bottom: 2px; margin-bottom: 14px; -webkit-overflow-scrolling: touch;
  }
  .snap-tab-btn {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 8px 12px; cursor: pointer; white-space: nowrap;
    font-size: 14px; font-weight: 500; transition: color 0.15s, border-color 0.15s;
  }
  .snap-tab-btn:hover { color: #f8fafc; }
  .snap-tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .snap-tab-panel[hidden] { display: none !important; }
  .snap-chart-card {
    border: 1px solid rgba(148, 163, 184, 0.16); border-radius: 10px;
    background: rgba(17, 26, 46, 0.65); padding: 6px; margin-bottom: 12px;
  }
  .snap-plotly { width: 100%; min-height: 220px; }
  .snap-tbl-wrap {
    overflow: auto; max-height: 400px; -webkit-overflow-scrolling: touch;
    margin: 6px 0 12px; border: 1px solid var(--border); border-radius: 8px;
  }
  .snap-tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
  .snap-tbl th, .snap-tbl td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; }
  .snap-tbl th { position: sticky; top: 0; color: var(--muted); font-weight: 600; background: #131d33; z-index: 2; }
  .dr { color: var(--text) !important; }
  .dr .dn.on { background: rgba(250, 200, 60, 0.72); color: #0f172a; }
  .dr .dpanel { background: #0f172a; border-color: var(--border); }
  .dr .dpanel a { color: var(--accent); }
  #snap-toast {
    position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 7000;
    padding: 10px 16px; border-radius: 10px; background: #1e293b; color: #f8fafc;
    border: 1px solid var(--accent); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    font-size: 13.5px; max-width: 90vw; text-align: center;
  }
  @media (max-width: 768px) {
    .portal-wrap { padding: 8px 10px 76px; }
    .snap-cols { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="login-view" class="login-shell">
  <div class="di-login-card">
    <h2>Please enter password</h2>
    <form id="login-form" class="di-login-form" autocomplete="off">
      <input id="pw-input" class="di-input" type="password" placeholder="Password..." required autofocus>
      <button id="pw-btn" class="di-btn" type="submit">Sign in</button>
    </form>
    <div id="login-err" class="di-login-err"></div>
  </div>
</div>

<div id="live-shell" hidden>
  <iframe id="live-frame" allow="clipboard-write; fullscreen"></iframe>
</div>

<div id="app-view" class="portal-wrap" hidden>
  <div class="portal-bar">
    <div id="portal-status"></div>
    <div id="portal-updated" style="color:var(--muted)"></div>
  </div>
  <div id="portal-content"></div>
</div>

<div id="mode-dock" hidden>
  <span id="dock-status"></span>
  <button id="dock-switch-btn" class="dock-btn" type="button" hidden></button>
  <a id="dock-ext-link" class="dock-btn" href="#" target="_blank" rel="noopener" hidden>↗</a>
  <button id="lock-btn" class="dock-btn" type="button">🔒</button>
</div>

<div id="snap-toast" hidden></div>

<script>
(function () {
  "use strict";
  const PAYLOAD = JSON.parse(document.getElementById("enc-payload").textContent);
  let CURRENT_DATA = null;
  let CHARTS = {};
  let RENDERED = new Set();
  let PLOTLY_LOADING = null;
  let LIVE_ONLINE = false;
  let IN_LIVE_MODE = false;
  let TOAST_TIMER = null;

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) { out[i] = bin.charCodeAt(i); }
    return out;
  }

  function showToast(msg) {
    const el = document.getElementById("snap-toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(TOAST_TIMER);
    TOAST_TIMER = setTimeout(() => { el.hidden = true; }, 3200);
  }

  async function decryptEnvelope(env, password) {
    if (!window.crypto || !window.crypto.subtle) {
      throw new Error("WebCrypto requires HTTPS or localhost.");
    }
    const enc = new TextEncoder();
    const salt = b64ToBytes(env.salt);
    const nonce = b64ToBytes(env.nonce);
    const ct = b64ToBytes(env.ct);
    const tag = b64ToBytes(env.tag);
    const iter = Number(env.iter || 100000);

    const keyMat = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: salt, iterations: iter, hash: "SHA-256" },
      keyMat, 512
    );
    const encKey = new Uint8Array(bits, 0, 32);
    const macKeyRaw = new Uint8Array(bits, 32, 32);

    const macInput = new Uint8Array(salt.length + nonce.length + ct.length);
    macInput.set(salt, 0);
    macInput.set(nonce, salt.length);
    macInput.set(ct, salt.length + nonce.length);
    const macKey = await crypto.subtle.importKey("raw", macKeyRaw, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    const computedTag = new Uint8Array(await crypto.subtle.sign("HMAC", macKey, macInput));
    let diff = computedTag.length ^ tag.length;
    for (let i = 0; i < tag.length; i++) { diff |= computedTag[i] ^ tag[i]; }
    if (diff !== 0) {
      throw new Error("Incorrect password. Please try again.");
    }

    const totalBlocks = Math.ceil(ct.length / 32);
    const plainGz = new Uint8Array(ct.length);
    const BATCH = 256;
    for (let start = 0; start < totalBlocks; start += BATCH) {
      const end = Math.min(totalBlocks, start + BATCH);
      const jobs = [];
      for (let idx = start; idx < end; idx++) {
        const inp = new Uint8Array(52);
        inp.set(encKey, 0);
        inp.set(nonce, 32);
        inp[48] = (idx >>> 24) & 255;
        inp[49] = (idx >>> 16) & 255;
        inp[50] = (idx >>> 8) & 255;
        inp[51] = idx & 255;
        jobs.push(crypto.subtle.digest("SHA-256", inp).then((buf) => ({ idx, ks: new Uint8Array(buf) })));
      }
      const res = await Promise.all(jobs);
      for (const item of res) {
        const offset = item.idx * 32;
        const limit = Math.min(32, ct.length - offset);
        for (let j = 0; j < limit; j++) {
          plainGz[offset + j] = ct[offset + j] ^ item.ks[j];
        }
      }
    }

    if (typeof DecompressionStream !== "undefined") {
      const stream = new Blob([plainGz]).stream().pipeThrough(new DecompressionStream("gzip"));
      return await new Response(stream).text();
    }
    throw new Error("This browser does not support DecompressionStream('gzip').");
  }

  function ensurePlotly() {
    if (window.Plotly) { return Promise.resolve(window.Plotly); }
    if (PLOTLY_LOADING) { return PLOTLY_LOADING; }
    PLOTLY_LOADING = new Promise((resolve, reject) => {
      const sc = document.createElement("script");
      sc.src = "https://cdn.plot.ly/plotly-3.7.0.min.js";
      sc.async = true;
      sc.onload = () => resolve(window.Plotly);
      sc.onerror = () => reject(new Error("Could not load chart library."));
      document.head.appendChild(sc);
    });
    return PLOTLY_LOADING;
  }

  function applyDarkTheme(layout) {
    const out = Object.assign({}, layout || {});
    out.paper_bgcolor = "rgba(0,0,0,0)";
    out.plot_bgcolor = out.plot_bgcolor || "rgba(148,163,184,0.06)";
    out.font = Object.assign({ color: "#e2e8f0" }, out.font || {}, { color: "#e2e8f0" });
    if (out.title && typeof out.title === "object") {
      out.title = Object.assign({}, out.title, { font: Object.assign({ color: "#f8fafc" }, out.title.font || {}) });
    }
    if (out.legend && typeof out.legend === "object") {
      out.legend = Object.assign({}, out.legend, { font: Object.assign({ color: "#cbd5e1" }, out.legend.font || {}) });
    }
    for (const k of Object.keys(out)) {
      if (/^[xy]axis/.test(k) && typeof out[k] === "object") {
        out[k] = Object.assign({}, out[k], {
          color: "#94a3b8",
          tickfont: Object.assign({ color: "#94a3b8" }, out[k].tickfont || {}),
          gridcolor: out[k].gridcolor || "rgba(148,163,184,0.16)",
        });
      }
      if (/^geo/.test(k) && typeof out[k] === "object") {
        out[k] = Object.assign({}, out[k], {
          bgcolor: "rgba(0,0,0,0)",
          lakecolor: "#0b1220",
          landcolor: "rgba(148,163,184,0.14)",
          subunitcolor: "rgba(148,163,184,0.28)",
        });
      }
    }
    return out;
  }

  async function renderVisibleCharts(scopeEl) {
    const root = scopeEl || document.getElementById("portal-content");
    const slots = root.querySelectorAll(".snap-plotly[data-chart-id]");
    const toDraw = [];
    slots.forEach((el) => {
      if (el.offsetParent === null) { return; }
      const id = el.getAttribute("data-chart-id");
      if (RENDERED.has(id)) {
        if (window.Plotly) { try { window.Plotly.Plots.resize(el); } catch (_) {} }
      } else if (CHARTS[id]) {
        toDraw.push({ el, id });
      }
    });
    if (!toDraw.length) { return; }
    try {
      const Plotly = await ensurePlotly();
      for (const item of toDraw) {
        const spec = CHARTS[item.id];
        await Plotly.newPlot(item.el, spec.data || [], applyDarkTheme(spec.layout), {
          responsive: true,
          displaylogo: false,
        });
        RENDERED.add(item.id);
      }
    } catch (err) {
      toDraw.forEach((item) => { item.el.textContent = err.message || "Chart failed to load."; });
    }
  }

  async function probeLiveServer(liveUrl) {
    if (!liveUrl) { return false; }
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 3000);
      const res = await fetch(liveUrl.replace(/\/+$/, "") + "/_stcore/health", {
        mode: "cors", cache: "no-store", signal: ctrl.signal,
      });
      clearTimeout(timer);
      const body = res.ok ? (await res.text()).trim() : "";
      return Boolean(res.ok && body === "ok");
    } catch (_) {
      return false;
    }
  }

  function setMode(useLive) {
    IN_LIVE_MODE = Boolean(useLive && LIVE_ONLINE && CURRENT_DATA && CURRENT_DATA.live_url);
    const liveShell = document.getElementById("live-shell");
    const liveFrame = document.getElementById("live-frame");
    const appView = document.getElementById("app-view");
    const dockStatus = document.getElementById("dock-status");
    const dockSwitch = document.getElementById("dock-switch-btn");
    const dockExt = document.getElementById("dock-ext-link");
    const target = CURRENT_DATA ? (CURRENT_DATA.live_auth_url || CURRENT_DATA.live_url) : "";
    const stamp = CURRENT_DATA ? (CURRENT_DATA.generated_at || "unknown") : "";

    if (IN_LIVE_MODE) {
      appView.hidden = true;
      liveShell.hidden = false;
      if (liveFrame.getAttribute("src") !== target) {
        liveFrame.setAttribute("src", target);
      }
      dockStatus.innerHTML = '<span class="dock-badge-live">🟢 Canlı (PC Açık)</span>';
      dockSwitch.hidden = false;
      dockSwitch.textContent = "Çevrimdışı Kopya";
      dockExt.href = target;
      dockExt.hidden = false;
    } else {
      liveShell.hidden = true;
      appView.hidden = false;
      document.getElementById("portal-status").innerHTML = LIVE_ONLINE
        ? '<span class="dock-badge-live">🟢 Canlı Sunucu Çevrimiçi (Çevrimdışı kopya görüntüleniyor)</span>'
        : '<span class="dock-badge-off">🕒 Çevrimdışı Kopya (PC Kapalı)</span>';
      document.getElementById("portal-updated").textContent = "Son güncelleme: " + stamp;
      if (LIVE_ONLINE) {
        dockStatus.innerHTML = '<span class="dock-badge-live">🟢 PC Açık</span>';
        dockSwitch.hidden = false;
        dockSwitch.textContent = "Canlı Sunucuya Geç";
        dockExt.href = target;
        dockExt.hidden = false;
      } else {
        dockStatus.innerHTML = `<span class="dock-badge-off">🕒 Çevrimdışı (${stamp})</span>`;
        dockSwitch.hidden = true;
        dockExt.hidden = true;
      }
      renderVisibleCharts(document.getElementById("portal-content"));
    }
    window.scrollTo(0, 0);
  }

  function installInteractions() {
    const content = document.getElementById("portal-content");
    content.addEventListener("click", (ev) => {
      const btn = ev.target.closest(".snap-tab-btn");
      if (btn) {
        const groupId = btn.getAttribute("data-tabs-id");
        const targetId = btn.getAttribute("data-tab-target");
        const block = document.getElementById(groupId);
        if (!block) { return; }
        block.querySelectorAll(":scope > .snap-tab-bar > .snap-tab-btn").forEach((b) => {
          b.classList.toggle("active", b === btn);
        });
        block.querySelectorAll(":scope > .snap-tab-panels > .snap-tab-panel").forEach((p) => {
          const active = p.id === targetId;
          p.classList.toggle("active", active);
          p.hidden = !active;
          if (active) { renderVisibleCharts(p); }
        });
        return;
      }
      const action = ev.target.closest("[data-offline-action]");
      if (action && !action.classList.contains("snap-brand-switcher") && !action.classList.contains("snap-grain-switcher")) {
        if (action.tagName === "BUTTON") {
          showToast(LIVE_ONLINE
            ? "Bu işlem için sağ alttan 'Canlı Sunucuya Geç' butonuna basın."
            : "Bu işlem canlı sunucu gerektirir (PC açıldığında otomatik aktif olur).");
        }
      }
    });
    content.addEventListener("change", (ev) => {
      const brandSel = ev.target.closest(".snap-brand-switcher");
      if (brandSel) {
        const chosen = brandSel.value;
        const container = brandSel.closest(".snap-tab-panel") || content;
        container.querySelectorAll(".snap-brand-panel").forEach((p) => {
          const active = p.getAttribute("data-brand") === chosen;
          p.hidden = !active;
          if (active) { renderVisibleCharts(p); }
        });
        return;
      }
      const grainSel = ev.target.closest(".snap-grain-switcher");
      if (grainSel) {
        const chosen = grainSel.value;
        const container = grainSel.closest(".snap-tab-panel") || content;
        container.querySelectorAll(".snap-grain-panel").forEach((p) => {
          const active = p.getAttribute("data-grain") === chosen;
          p.hidden = !active;
          if (active) { renderVisibleCharts(p); }
        });
      }
    });
    content.addEventListener("toggle", (ev) => {
      if (ev.target && ev.target.tagName === "DETAILS" && ev.target.open) {
        renderVisibleCharts(ev.target);
      }
    }, true);
    window.addEventListener("resize", () => {
      if (!window.Plotly) { return; }
      content.querySelectorAll(".snap-plotly[data-chart-id]").forEach((el) => {
        if (el.offsetParent !== null && RENDERED.has(el.getAttribute("data-chart-id"))) {
          try { window.Plotly.Plots.resize(el); } catch (_) {}
        }
      });
    });
    document.getElementById("dock-switch-btn").addEventListener("click", () => {
      setMode(!IN_LIVE_MODE);
    });
  }

  async function mountDashboard(data) {
    CURRENT_DATA = data;
    CHARTS = data.charts || {};
    RENDERED = new Set();
    const content = document.getElementById("portal-content");
    content.innerHTML = data.html || "";
    for (const code of (data.scripts || [])) {
      try { (0, eval)(code); } catch (e) { console.error("Snapshot script error", e); }
    }
    LIVE_ONLINE = await probeLiveServer(data.live_url);

    const loginView = document.getElementById("login-view");
    loginView.hidden = true;
    loginView.style.display = "none";
    document.getElementById("mode-dock").hidden = false;
    setMode(LIVE_ONLINE);
  }

  function lockPortal() {
    CURRENT_DATA = null;
    CHARTS = {};
    RENDERED = new Set();
    LIVE_ONLINE = false;
    IN_LIVE_MODE = false;
    document.getElementById("live-frame").setAttribute("src", "about:blank");
    document.getElementById("live-shell").hidden = true;
    document.getElementById("portal-content").innerHTML = "";
    document.getElementById("app-view").hidden = true;
    document.getElementById("mode-dock").hidden = true;
    const loginView = document.getElementById("login-view");
    loginView.hidden = false;
    loginView.style.display = "flex";
    document.getElementById("pw-input").value = "";
    document.getElementById("login-err").style.display = "none";
    window.scrollTo(0, 0);
    document.getElementById("pw-input").focus();
  }

  installInteractions();
  document.getElementById("lock-btn").addEventListener("click", lockPortal);
  document.getElementById("login-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = document.getElementById("pw-btn");
    const err = document.getElementById("login-err");
    const pw = document.getElementById("pw-input").value || "";
    const origText = btn.textContent;
    err.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Connecting...";
    try {
      const jsonText = await decryptEnvelope(PAYLOAD, pw);
      const data = JSON.parse(jsonText);
      await mountDashboard(data);
    } catch (e) {
      err.textContent = e && e.message ? e.message : "Incorrect password. Please try again.";
      err.style.display = "block";
    } finally {
      btn.disabled = false;
      btn.textContent = origText;
    }
  });
})();
</script>
</body>
</html>
